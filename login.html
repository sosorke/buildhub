<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login BuildHub para administradores e clientes.">
  <title>Login | BuildHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>if (localStorage.getItem("buildhub_theme") === "dark") document.documentElement.classList.add("dark-theme");</script>
</head>
<body data-page="login">
  <div class="loader" id="loader" aria-label="Carregando login">
     <span class="brand-symbol" id="brandSymbol"><img src="assets/images/logobranca.png" alt="" aria-hidden="true"><span class="brand-fallback">BH</span></span>
    <div class="loader-line"></div>
  </div>

  <div class="custom-cursor" id="customCursor" aria-hidden="true"></div>
  <canvas id="particleCanvas" aria-hidden="true"></canvas>
  <div class="floating-grid" id="floatingGrid" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="navbar" aria-label="Navegacao principal">
      <a class="brand" href="index.html">
        <span class="brand-symbol" id="brandSymbol"><img src="assets/images/logobranca.png" alt="" aria-hidden="true"><span class="brand-fallback">BH</span></span>
        <span class="brand-text" id="brandText">BuildHub</span>
      </a>
      <div class="nav-menu single-link">
        <a href="index.html">Voltar ao site</a>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Ativar tema escuro" title="Ativar tema escuro">🌙</button>
    </nav>
  </header>

  <main>
    <section class="section login-section standalone-auth" id="login">
      <div class="section-heading reveal">
        <p class="eyebrow">Acesso BuildHub</p>
        <h1>Entrar na BuildHub</h1>
      </div>
      <div class="login-shell reveal">
        <div class="auth-tabs" role="tablist" aria-label="Acesso à BuildHub">
          <button class="auth-tab active" type="button" data-auth-tab="login" role="tab" aria-selected="true">Entrar</button>
          <button class="auth-tab" type="button" data-auth-tab="register" role="tab" aria-selected="false">Cadastrar</button>
        </div>
        <form class="login-card glass" id="loginForm" novalidate>
          <div class="login-badge">
            <img src="assets/images/logoazul.png" alt="" aria-hidden="true">
          </div>
          <h3>Login seguro</h3>
          <div class="form-row">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" placeholder="seu acesso" autocomplete="email">
            <small></small>
          </div>
          <div class="form-row password-row">
            <label for="loginPassword">Senha</label>
            <div class="password-field">
              <input id="loginPassword" type="password" placeholder="sua senha" autocomplete="current-password">
              <button id="togglePassword" type="button" aria-label="Mostrar senha">Ver</button>
            </div>
            <small></small>
          </div>
          <label class="remember">
            <input id="rememberLogin" type="checkbox">
            <span>Lembrar login</span>
          </label>
          <button class="btn btn-primary magnetic" type="submit">Entrar</button>
        </form>
        <form class="login-card glass" id="registerForm" novalidate hidden>
          <div class="login-badge">
            <img src="assets/images/logoazul.png" alt="" aria-hidden="true">
          </div>
          <h3>Crie sua conta</h3>
          <div class="form-row">
            <label for="registerName">Nome</label>
            <input id="registerName" name="name" type="text" placeholder="Seu nome completo" autocomplete="name">
            <small></small>
          </div>
          <div class="form-row">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" name="email" type="email" placeholder="voce@email.com" autocomplete="email">
            <small></small>
          </div>
          <div class="form-row">
            <label for="registerCpf">CPF</label>
            <input id="registerCpf" name="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
            <small></small>
          </div>
          <div class="form-row password-row">
            <label for="registerPassword">Senha</label>
            <div class="password-field">
              <input id="registerPassword" name="password" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
              <button class="password-toggle" type="button" data-toggle-password="registerPassword" aria-label="Mostrar senha">Ver</button>
            </div>
            <small></small>
          </div>
          <div class="form-row password-row">
            <label for="registerPasswordConfirm">Confirmar senha</label>
            <div class="password-field">
              <input id="registerPasswordConfirm" name="passwordConfirm" type="password" placeholder="Repita sua senha" autocomplete="new-password">
              <button class="password-toggle" type="button" data-toggle-password="registerPasswordConfirm" aria-label="Mostrar senha">Ver</button>
            </div>
            <small></small>
          </div>
          <button class="btn btn-primary magnetic" type="submit">Cadastrar</button>
        </form>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <button class="to-top" id="toTop" type="button" aria-label="Voltar ao topo">^</button>
  <script src="script.js"></script>
</body>
</html>
